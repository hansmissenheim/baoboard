<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BaoBoard</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <nav id="tabs" role="tablist" aria-label="Tabs"></nav>
    <main id="grid" role="listbox" aria-label="Stickers"></main>
    <section id="settings" hidden>
      <label>
        Sticker size
        <select id="size">
          <option value="128">128 px</option>
          <option value="160">160 px</option>
          <option value="240">240 px</option>
          <option value="320">320 px</option>
        </select>
      </label>
      <label>
        Shortcut
        <button id="shortcut" type="button"></button>
      </label>
    </section>
    <form id="editor" hidden>
      <label>
        Name
        <input id="tab-name" required maxlength="40" />
      </label>
      <div class="icon-row">
        <span id="icon-preview" class="tab-icon"></span>
        <input id="tab-emoji" maxlength="16" placeholder="Emoji" aria-label="Emoji icon" />
        <button id="upload-icon" type="button">Upload…</button>
      </div>
      <div id="emojis" aria-label="Emoji icons"></div>
      <div class="actions">
        <button id="cancel-tab" type="button">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
    <footer>
      <span id="status" role="status"></span>
      <button id="gear" type="button" aria-label="Settings">⚙︎</button>
    </footer>
    <input id="picker" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp,image/avif,video/mp4" multiple hidden />
    <input id="icon-picker" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" hidden />
  </body>
</html>
