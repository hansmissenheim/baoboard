[package]
name = "baoboard"
version = "0.1.0"
description = "WeChat-style sticker keyboard"
authors = ["Hans Missenheim"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "baoboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "webp", "bmp"] }
clipboard-rs = "0.3"
tauri-plugin-global-shortcut = "2"
enigo = "0.6"

# Decoding and re-encoding GIFs is many times slower unoptimized, which makes
# `mise run dev` feel broken. Only dependencies are optimized, so our own code
# still builds fast.
[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-application-services = "0.3"
objc2-core-foundation = "0.3"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_Variant", "Win32_System_Com"] }
