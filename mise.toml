[tools]
node = "24"
rust = { version = "1.98", components = "rustfmt,clippy" }

[tasks.check]
description = "Build, lint and test everything; CI runs exactly this"
run = [
  "npm run build",
  "node --test \"src/*.test.ts\"",
  "cargo fmt --manifest-path src-tauri/Cargo.toml --check",
  "cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings",
  "cargo test --manifest-path src-tauri/Cargo.toml",
]

[tasks.dev]
description = "Run the app with hot reload"
run = "npm run tauri dev"

[tasks.install]
description = "Build the app and install it to /Applications (macOS)"
run = [
  # The updater bundles need the release signing key, which only CI has.
  """npm run tauri build -- --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'""",
  "pkill -x baoboard || true",
  "rm -rf /Applications/BaoBoard.app",
  "mv src-tauri/target/release/bundle/macos/BaoBoard.app /Applications/",
  "open /Applications/BaoBoard.app",
]
